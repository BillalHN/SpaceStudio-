<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billal's AI Music Master Studio</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: sans-serif; text-align: center; padding: 50px; }
        .container { background: #1e293b; padding: 30px; border-radius: 15px; display: inline-block; }
        input { padding: 10px; width: 250px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Music Master Studio</h1>
        <p id="status">Studio Status: Ready...</p>
        <input type="text" id="promptInput" placeholder="Enter music style (e.g. Lofi, Retro)">
        <br>
        <button onclick="generateMusic()">GENERATE MUSIC</button>
        <br><br>
        <audio id="audioPlayer" controls>
            <source id="audioSource" src="" type="audio/mpeg">
        </audio>
    </div>

    <script>
        async function generateMusic() {
            const prompt = document.getElementById('promptInput').value;
            document.getElementById('status').innerText = 'Generating... (1-2 mins)';
            
            try {
                const response = await fetch(`https://multiramous-carolin-inhalingly.ngrok-free.dev/generate-custom/?prompt=${encodeURIComponent(prompt)}`);
                const data = await response.json();

                const audio = document.getElementById('audioSource');
                audio.src = `https://multiramous-carolin-inhalingly.ngrok-free.dev${data.file_url}`;
                
                const player = document.getElementById('audioPlayer');
                player.load();
                player.play();
                document.getElementById('status').innerText = 'Playing now...';
            } catch (error) {
                alert('CMD Server-e somossya!');
                document.getElementById('status').innerText = 'Error occurred!';
            }
        }
    </script>
</body>
</html>
